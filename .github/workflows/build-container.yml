# Build and push a container image to GHCR (free for public repos; FOSS-friendly).
#
# TEMPLATE: dormant until a derived repo adds a Dockerfile. Adjust the `paths` trigger
# and image labels for the project. Pushes to ghcr.io/<owner>/<repo>.
name: Build and Push to GHCR

on:
  workflow_dispatch:
    inputs:
      extra_tags:
        description: "Additional tags (comma-separated, e.g. 'v1.0,release')"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-container.yml"
      # TODO: add source paths that should trigger a rebuild, e.g. "src/**".

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Process extra tags
        id: extra-tags
        run: |
          if [ -n "${{ inputs.extra_tags }}" ]; then
            EXTRA_TAGS=$(echo "${{ inputs.extra_tags }}" | tr ',' '\n' | sed 's/^/type=raw,value=/')
            { echo "tags<<EOF"; echo "$EXTRA_TAGS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest
            ${{ steps.extra-tags.outputs.tags }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
