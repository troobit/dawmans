[project]
name = "dawmans"
version = "0.1.0"
description = "Grounded answers over DAW manuals: corpus ingestion, retrieval and a loopback answer engine"
requires-python = ">=3.12"
dependencies = []

# The split keeps PyMuPDF (AGPL) out of the served process: the API host runs
# `uv sync --extra serve` and never installs the ingest group.
[project.optional-dependencies]
ingest = [
    "pymupdf",
    "lingua-language-detector", # lingua-py's name on PyPI
    "fonttools",
]
serve = [
    "fastembed",
    "bm25s",
    "numpy",
    "anthropic",
    "httpx", # the local provider's own client; already a transitive dep of anthropic
    "starlette",
    "uvicorn",
    "keyring",
]

[project.scripts]
dawmans = "dawmans.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dawmans"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
